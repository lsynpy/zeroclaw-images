# Build Docker Image and push to GHCR
# =====================================
# Triggers automatically when a new ZeroClaw binary release
# is published, or manually to build a specific version.

name: Build Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'ZeroClaw version tag (e.g. v0.8.0-beta-2)'
        required: true
        type: string
      image_tag:
        description: 'Docker image tag (default: same as version)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: zeroclaw-full

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            # Extract version from release tag: zeroclaw-daemon-v0.8.0-beta-2 → v0.8.0-beta-2
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#zeroclaw-daemon-}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          IMAGE_TAG="${{ github.event.inputs.image_tag || VERSION }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/zeroclaw-full
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
